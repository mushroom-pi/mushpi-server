openapi: 3.0.0
paths:
  /ping:
    get:
      operationId: MonitoringController_ping
      parameters: []
      responses:
        '200':
          description: Server is up and running
          schema:
            example: pong
          content:
            application/json:
              schema:
                type: string
        '500':
          description: Generic unknown error produced by an unidentified exception
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                    example: 500
                  error:
                    type: string
                    example: Internal Server Error
                  message:
                    type: string
                    example: Internal server error
                    description: The sort of error message you can expect
                  emitter:
                    type: string
                    example: ErrorProducerModule
                    description: If the error was produced within the codebase, the name of the module where it was created
                  timestamp:
                    type: string
                    example: '2024-09-14T22:00:00.000Z'
                  path:
                    type: string
                    example: /path/of/the/failing/route
                    description: Endpoint responsible for the production of the error
        '503':
          description: The event loop is lagging and no more requests can be attended right now
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                    example: 503
                  error:
                    type: string
                    example: Service Unavailable
                  message:
                    type: string
                    example: Server is too busy
                    description: The sort of error message you can expect
                  emitter:
                    type: string
                    example: ErrorProducerModule
                    description: If the error was produced within the codebase, the name of the module where it was created
                  timestamp:
                    type: string
                    example: '2024-09-14T22:00:00.000Z'
                  path:
                    type: string
                    example: /path/of/the/failing/route
                    description: Endpoint responsible for the production of the error
      security:
        - secret: []
      summary: The simplest server status check
      tags:
        - monitoring
        - no-validation
  /health:
    get:
      operationId: MonitoringController_health
      parameters:
        - name: server
          required: false
          in: query
          description: Include or remove server health information
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
        - name: databases
          required: false
          in: query
          description: Comma-separated list of database names to check
          schema:
            type: string
            enum:
              - all
              - none
              - sqlite
        - name: services
          required: false
          in: query
          description: Comma-separated list of external services names to check
          schema:
            type: string
            enum:
              - all
              - none
              - serviceMock
      responses:
        '200':
          description: Status of the server and any requested dependencies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponseDto'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                    example: 422
                  error:
                    type: string
                    example: Unprocessable Entity
                  message:
                    type: string
