info:
  title: mushpi-server
  description: A backend for the Mushroom Pi project
  version: 0.1.0
  contact: {}
tags:
  - name: monitoring
    description: Check the health of the microservice and it's dependencies
servers: []
components:
  securitySchemes:
    secret:
      type: http
      scheme: bearer
      in: header
      name: authorization
  schemas:
    MemoryUsageDto:
      type: object
      properties:
        rss:
          type: number
          example: 74.57
        readonlyheapTotal:
          type: number
          example: 54.23
        readonlyheapUsed:
          type: number
          example: 35.67
        external:
          type: number
          example: 1.18
        arrayBuffers:
          type: number
          example: 0.44
      required:
        - rss
        - readonlyheapTotal
        - readonlyheapUsed
        - external
        - arrayBuffers
    UpTime:
      type: object
      properties:
        seconds:
          type: number
          description: Total time the server has been running in seconds
        minutes:
          type: number
          description: Total time the server has been running in minutes
        hours:
          type: number
          description: Total time the server has been running in hours
        days:
          type: number
          description: Total time the server has been running in days
      required:
        - seconds
        - minutes
        - hours
        - days
    ServerDto:
      type: object
      properties:
        healthy:
          type: boolean
        environment:
          type: string
          enum:
            - dev
            - local
            - prod
            - staging
            - test
          description: The environment in which this instance of the service is being executed
        loadAverage:
          example:
            - 0.12
            - 0.34
            - 0.56
          description: Basic estimation of the system's memory load
          type: array
          items:
            type: number
        memoryUsageInMB:
          $ref: '#/components/schemas/MemoryUsageDto'
        upTime:
          $ref: '#/components/schemas/UpTime'
        nodeVersion:
          type: string
          example: v14.17.0
        appVersion:
          type: string
          example: 1.0.0
      required:
        - healthy
        - environment
        - loadAverage
        - memoryUsageInMB
        - upTime
        - nodeVersion
        - appVersion
    DatabaseMockDto:
      type: object
      properties:
        read:
          type: boolean
          description: Check that the provided credentials have read privileges
        write:
          type: boolean
          description: Check that the provided credentials have write privileges
      required:
        - read
        - write
    ServiceMockDto:
      type: object
      properties:
        hasKey:
          type: boolean
          description: Check if theres a key to stablish communications with the service
        available:
          type: boolean
          description: Check if the service is reachable
        responseTimeInMs:
          type: number
          description: If the service is reachable, the time it takes to provide a response
      required:
        - hasKey
        - available
    ServicesDto:
      type: object
      properties:
        serviceMock:
          $ref: '#/components/schemas/ServiceMockDto'
    HealthCheckResponseDto:
      type: object
      properties:
        server:
          $ref: '#/components/schemas/ServerDto'
        databases:
          description: Check any database that the microservice needs to operate
          allOf:
            - $ref: '#/components/schemas/DatabaseMockDto'
        services:
          $ref: '#/components/schemas/ServicesDto'
      required:
        - databases
    ErrorDto:
      type: object
      properties: {}
    CreatePicoUnitDto:
      type: object
      properties:
        handle:
          type: string
          example: unit-01
          description: Handle (mDNS name) of the Pico unit to add manually
          minLength: 1
          maxLength: 64
      required:
        - handle
    Readings:
      type: object
      properties: {}
    PicoUnit:
      type: object
      properties:
        host:
          type: string
          description: mDNS hostname derived from handle
          example: unit-01.local
        failed_calls:
          type: integer
          description: Consecutive unreachable polls from the server cron
          example: 0
        failed_readings:
          type: integer
          description: Consecutive out-of-range DHT11 readings (0-50°C, 10-90% humidity). Resets to 0 on a valid reading.
          example: 0
        consecutive_empty_readings:
          type: integer
          description: >-
            Consecutive polls where both temp and humidity were null (sensor returned no data). Resets to 0 when at
            least one value is non-null.
          example: 0
        address:
          type: string
          description: Local mDNS address for the pico unit's REST API
          example: http://unit-01.local:5000
        ipAddress:
          type: string
          description: IP-based address for the pico unit (fallback)
          example: http://192.168.1.50:5000
          nullable: true
        latest_reading:
          nullable: true
          description: Latest reading row for this unit (computed, not stored)
          allOf:
            - $ref: '#/components/schemas/Readings'
      required:
        - host
        - failed_calls
        - failed_readings
        - consecutive_empty_readings
        - address
        - ipAddress
        - latest_reading
    AnnouncePicoUnitDto:
      type: object
      properties:
        handle:
          type: string
          example: unit-01
          description: Name for the unit as it is stated in its own software. Should not be changed.
          minLength: 1
          maxLength: 64
        ip:
          type: string
          description: IPv4 address where the Pico API is reachable. Provided by the unit on announcement.
          example: 192.168.1.50
        port:
          type: number
          example: 5000
          minimum: 1
          maximum: 65535
          default: 5000
          description: Pico API port
        micropython_version:
          type: string
          minLength: 1
          maxLength: 255
          description: Version tag for the Micropython executed by the unit
          examples:
            - v1.26.0 on 2025-08-09 (GNU 14.2.0 MinSizeRel)
            - 1.26.0.
        software_version:
          type: string
          minLength: 1
          maxLength: 255
          description: Version tag for the custom software executed by the unit
          examples:
            - 0.1.0
        board:
          type: string
          minLength: 1
          maxLength: 255
          description: Name of the unit's board
          examples:
            - Raspberry Pi Pico 2 W with RP2350
        board_total_mem_byte:
          type: number
          description: Size of the unit's memory in bytes
        board_total_fs_byte:
          type: number
          description: Size of the unit's file system in bytes
        board_cpu_freq_mhz:
          type: number
          description: CPU Frequency in MHz
        mac:
          type: string
          description: Physical MAC address of the unit
          examples:
            - 2c:cf:67:be:95:30
      required:
        - handle
        - port
    PicoUnitListResponseDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PicoUnit'
        page:
          type: number
          example: 1
          minimum: 1
        limit:
          type: number
          example: 20
          minimum: 1
          maximum: 500
        total:
          type: number
          example: 42
          minimum: 0
        pages:
          type: number
          example: 3
          minimum: 0
      required:
        - items
        - page
        - limit
        - total
        - pages
    UpdatePicoUnitDto:
      type: object
      properties:
        name:
          type: string
          minLength: 0
          maxLength: 128
          description: Friendly name of the unit.
          examples:
            - Grow Tent A
        description:
          type: string
          description: Optional notes about this particular unit.
          maxLength: 512
        enabled:
          type: boolean
          default: true
          description: A flag that is true if the unit is active and reachable.
        face_color:
          type: string
          description: 'Cosmetic hex color assigned to the unit (e.g. #4CAF50).'
          example: '#4CAF50'
          pattern: ^#[0-9a-fA-F]{3}([0-9a-fA-F]{3})?$
    RebootDto:
      type: object
      properties:
        type:
          type: string
          enum:
            - hard
            - soft
          example: soft
          description: >-
            soft = machine.soft_reset() (preserves cumulative uptime); hard = machine.reset() (full power-cycle, uptime
            resets)
      required:
        - type
    RebootResponseDto:
      type: object
      properties:
        message:
          type: string
          example: Reboot initiated
        type:
          type: string
          enum:
            - hard
            - soft
          example: soft
      required:
        - message
        - type
    ReadingsListResponseDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Readings'
        page:
          type: number
          example: 1
          minimum: 1
        limit:
          type: number
          example: 20
          minimum: 1
          maximum: 500
        total:
          type: number
          example: 42
          minimum: 0
        pages:
          type: number
          example: 3
          minimum: 0
      required:
        - items
        - page
        - limit
        - total
        - pages
    CreateBatchDto:
      type: object
      properties:
        pico_unit_id:
          type: number
        start_at:
          type: string
        finish_at:
          type: string
        species:
          type: string
        temperature_target:
          type: number
          minimum: 0
          maximum: 50
        humidity_target:
          type: number
          minimum: 10
          maximum: 90
        notes:
          type: string
          maxLength: 2000
        description:
          type: string
          maxLength: 120
        recipe_id:
          type: number
          description: >-
            Optional recipe to use as a template. species, temperature_target and humidity_target will be copied from
            the recipe if not explicitly provided.
    Batch:
      type: object
      properties:
        images:
          description: Filenames of attached images
          type: array
          items:
            type: string
        images_url:
          description: Absolute URLs to the batch images (computed)
          example:
            - http://localhost:3000/images/batches/7/1.jpg
          type: array
          items:
            type: string
        status:
          type: string
          enum:
            - planned
            - in-progress
            - finished
          description: Current status of the batch (computed from start_at and finish_at)
          example: in-progress
        images_left:
          type: number
          description: Number of images that can still be uploaded to this batch
          example: 3
          minimum: 0
          maximum: 5
      required:
        - status
        - images_left
    BatchListResponseDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Batch'
        page:
          type: number
          example: 1
          minimum: 1
        limit:
          type: number
          example: 20
          minimum: 1
          maximum: 500
        total:
          type: number
          example: 42
          minimum: 0
        pages:
          type: number
          example: 3
          minimum: 0
      required:
        - items
        - page
        - limit
        - total
        - pages
    UpdateBatchDto:
      type: object
      properties:
        start_at:
          type: string
        finish_at:
          type: string
        species:
          type: string
        temperature_target:
          type: number
          minimum: 0
          maximum: 50
        humidity_target:
          type: number
          minimum: 10
          maximum: 90
        notes:
          type: string
          maxLength: 2000
        description:
          type: string
          maxLength: 120
    CreateRecipeFromBatchDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        notes:
          type: string
          maxLength: 2000
      required:
        - name
    Recipe:
      type: object
      properties:
        image:
          type: string
          description: Filename of the uploaded image or external URL
          example: 1.jpg
        image_url:
          type: string
          nullable: true
          description: Absolute URL to the image
          example: http://localhost:3000/images/recipes/1.jpg
      required:
        - image_url
    CreateRecipeDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        species:
          type: string
          minLength: 1
          maxLength: 255
        temperature_target:
          type: number
          minimum: 0
          maximum: 50
        humidity_target:
          type: number
          minimum: 10
          maximum: 90
        duration_days:
          type: number
          minimum: 1
        notes:
          type: string
          maxLength: 2000
      required:
        - name
        - species
        - temperature_target
        - humidity_target
        - duration_days
    RecipeListResponseDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Recipe'
        page:
          type: number
          example: 1
          minimum: 1
        limit:
          type: number
          example: 20
          minimum: 1
          maximum: 500
        total:
          type: number
          example: 42
          minimum: 0
        pages:
          type: number
          example: 3
          minimum: 0
      required:
        - items
        - page
        - limit
        - total
        - pages
    UpdateRecipeDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        species:
          type: string
          minLength: 1
          maxLength: 255
        temperature_target:
          type: number
          minimum: 0
          maximum: 50
        humidity_target:
          type: number
          minimum: 10
          maximum: 90
        duration_days:
          type: number
          minimum: 1
        notes:
          type: string
          maxLength: 2000
    ChangeSetPointsDto:
      type: object
      properties:
        temperature:
          type: number
          description: The temperature in Celsius degrees that we want the Pico Unit to maintain
          example: 27
          minimum: 0
          maximum: 50
        humidity:
          type: number
          description: The percentage of humidity that we want the Pico Unit to maintain
          example: 60
          minimum: 10
          maximum: 90
    SetpointsDto:
      type: object
      properties: {}
    ChangeSetupDto:
      type: object
      properties:
        active_high:
          type: boolean
          description: >-
            A flag that should be true if the relay's circuits are connected to the NO (Normally Open) port, and false
            if they are connected through NC (Normally Closed).
    DevicesDto:
      type: object
      properties: {}
    ChangeOutputsDto:
      type: object
      properties:
        humidifier:
          type: boolean
          description: A flag that should be true we want the humidifier to be ON
        fan:
          type: boolean
          description: A flag that should be true we want the fan to be ON
        heater:
          type: boolean
          description: A flag that should be true we want the heater to be ON
    OutputsDto:
      type: object
      properties: {}
    ControlLoopDto:
      type: object
      properties:
        enabled:
          type: boolean
          description: >-
            A flag that should be true if we want the Pico Unit to automatically turn on and off devices to meet the
            temperature and humidity goals.
      required:
        - enabled
    DashboardLastReadingDto:
      type: object
      properties:
        temperature:
          type: number
          nullable: true
        humidity:
          type: number
          nullable: true
        timestamp:
          type: string
