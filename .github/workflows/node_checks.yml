name: Check audit, build, lint run tests

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  node-checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Cache Node.js modules
        uses: actions/cache@v3
        with:
          path: ~/.yarn
          key: ${{ runner.OS }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.OS }}-yarn-

      - name: Install Dependencies
        run: yarn install

      - name: Prune
        run: yarn knip:ci

      - name: Audit dependencies
        run: yarn audit:ci

      - name: Build
        run: yarn build

      - name: Lint
        run: yarn lint

      - name: Unit tests
        run: yarn test

      - name: E2E tests
        run: yarn test:e2e --runInBand --detectOpenHandles --forceExit
